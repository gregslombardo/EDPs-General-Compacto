<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Balance de energía y propagación dentro de un cono</title>
  <desc id="desc">A la izquierda se muestra el intercambio entre energía cinética y elástica y los flujos de frontera. A la derecha, un cono pasado con energía que sólo puede entrar por sus lados.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4fb"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#2a78b8" stop-opacity=".10"/>
      <stop offset="1" stop-color="#2a78b8" stop-opacity=".34"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1261a0"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#a86c00"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#153552}
      .head{font:700 24px Arial,sans-serif;fill:#165d91}
      .body{font:20px Arial,sans-serif;fill:#203448}
      .small{font:18px Arial,sans-serif;fill:#456176}
      .formula{font:italic 22px Georgia,serif;fill:#173b57}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Método de energía: balance global y argumento local</text>

  <rect x="35" y="78" width="545" height="570" rx="22" fill="url(#panel)" stroke="#bfd3e3" stroke-width="2"/>
  <text x="307" y="120" text-anchor="middle" class="head">Balance en un intervalo</text>
  <line x1="105" y1="330" x2="510" y2="330" stroke="#173b57" stroke-width="8" stroke-linecap="round"/>
  <circle cx="105" cy="330" r="10" fill="#173b57"/>
  <circle cx="510" cy="330" r="10" fill="#173b57"/>
  <text x="92" y="365" class="small">0</text>
  <text x="503" y="365" class="small">L</text>
  <path d="M150 300 C215 215 280 385 345 295 C400 220 455 345 490 280" fill="none" stroke="#2a78b8" stroke-width="6"/>
  <text x="307" y="190" text-anchor="middle" class="formula">E = ½ ∫(uₜ² + c²uₓ²) dx</text>
  <rect x="115" y="430" width="165" height="72" rx="12" fill="#f5c75c" opacity=".86"/>
  <rect x="335" y="430" width="165" height="72" rx="12" fill="#67b7a5" opacity=".86"/>
  <text x="197" y="461" text-anchor="middle" class="body">cinética</text>
  <text x="197" y="487" text-anchor="middle" class="formula">uₜ²/2</text>
  <text x="417" y="461" text-anchor="middle" class="body">elástica</text>
  <text x="417" y="487" text-anchor="middle" class="formula">c²uₓ²/2</text>
  <path d="M280 466 L333 466" stroke="#1261a0" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M335 520 L282 520" stroke="#1261a0" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M100 330 L48 330" stroke="#a86c00" stroke-width="5" marker-end="url(#arrow-gold)"/>
  <path d="M515 330 L565 330" stroke="#a86c00" stroke-width="5" marker-end="url(#arrow-gold)"/>
  <text x="307" y="575" text-anchor="middle" class="body">La suma sólo cambia por fuerza o flujo de borde.</text>
  <text x="307" y="608" text-anchor="middle" class="small">Dirichlet, Neumann o periodicidad homogéneas anulan el flujo.</text>

  <rect x="620" y="78" width="545" height="570" rx="22" fill="url(#panel)" stroke="#bfd3e3" stroke-width="2"/>
  <text x="892" y="120" text-anchor="middle" class="head">Energía dentro del cono pasado</text>
  <line x1="675" y1="575" x2="1115" y2="575" stroke="#5c7487" stroke-width="3"/>
  <line x1="720" y1="610" x2="720" y2="165" stroke="#5c7487" stroke-width="3"/>
  <text x="1120" y="600" class="small">x</text>
  <text x="690" y="170" class="small">t</text>
  <polygon points="760,560 1025,560 892,205" fill="url(#cone)" stroke="#2a78b8" stroke-width="4"/>
  <circle cx="892" cy="205" r="9" fill="#d88b12"/>
  <text x="910" y="200" class="small">(x₀,T)</text>
  <line x1="805" y1="440" x2="980" y2="440" stroke="#173b57" stroke-width="6" stroke-linecap="round"/>
  <text x="892" y="420" text-anchor="middle" class="formula">Iₜ</text>
  <path d="M820 414 L782 337" stroke="#a86c00" stroke-width="4" marker-end="url(#arrow-gold)"/>
  <path d="M965 414 L1003 337" stroke="#a86c00" stroke-width="4" marker-end="url(#arrow-gold)"/>
  <text x="892" y="505" text-anchor="middle" class="body">Los lados son características.</text>
  <text x="892" y="535" text-anchor="middle" class="small">El balance produce cuadrados no positivos.</text>
  <text x="892" y="616" text-anchor="middle" class="body">Energía cero en la base ⇒ energía cero en el vértice.</text>
</svg>
